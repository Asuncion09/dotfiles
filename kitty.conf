font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.0
disable_ligatures never
wheel_scroll_multiplier 25.0
touch_scroll_multiplier 25.0

enable_audio_bell false
bell_on_tab "🔔 "

draw_minimal_borders yes

# hide_window_decorations titlebar-only
# wayland_titlebar_color #282a36
linux_display_server x11

remember_window_size  no
initial_window_width  960
initial_window_height 600

#tab_bar_edge bottom
#tab_bar_style powerline
#tab_powerline_style angled
#tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

tab_title_template "{activity_symbol}{title}"

window_border_width 1
draw_minimal_borders yes
window_margin_width 0
window_padding_width 0 3

background_opacity 1

cursor_shape beam

editor nvim

dynamic_background_opacity yes

# layouts
enabled_layouts fat:bias=75;

# Oxocarbon (IBM Carbon) para kitty

foreground            #dde1e7
background            #161616
selection_foreground  #dde1e7
selection_background  #393939
url_color             #78a9ff

