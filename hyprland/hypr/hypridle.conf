general {
  lock_cmd = qs ipc call lock lock
  before_sleep_cmd = loginctl lock-session; qs ipc call lock lock
  after_sleep_cmd = hyprctl dispatch dpms on && /home/daniel/.config/quickshell/scripts/ryzenadj/apply-profile.sh $(cat /home/daniel/.config/quickshell/state/power_profile.txt 2>/dev/null || echo balanced)
}

listener {
  timeout = 900
  on-timeout = loginctl lock-session
}

listener {
  timeout = 930
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

listener {
  timeout = 1200
  on-timeout = systemctl suspend
}
