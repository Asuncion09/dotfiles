general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor = 
    path = ~/.config/hypr/media/gruvbox_room.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.7
    brightness = 0.5
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

input-field {
    monitor = 
    size = 280, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(78a9ff)           # Azul IBM
    inner_color = rgb(262626)           # Superficie Oxocarbon
    font_color = rgb(dde1e7)            # Texto primario
    fade_on_empty = false

    placeholder_text = <span foreground="##dde1e7">Enter password...</span>
    hide_input = false
    rounding = 6
    position = 0, -120
    halign = center
    valign = center

    fail_color = rgb(ee5396)            # Rosa Oxocarbon
    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i>
    fail_transition = 300
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(dde1e7)                 # Texto primario
    font_size = 96
    font_family = Sans Bold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = rgb(a8b0bd)                 # Texto secundario
    font_size = 22
    font_family = Sans
    position = 0, 50
    halign = center
    valign = center
}
