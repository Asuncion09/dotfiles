general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/hypr/media/neighbor.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.85
    vibrancy = 0.2
}

# --- RELOJ DIGITAL ---
label {
    monitor =
    text = $TIME
    color = rgb(dde1e7)
    font_size = 96
    font_family = Red Hat Display Bold
    position = 0, 160
    halign = center
    valign = center
}

# --- FECHA ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgb(a8b0bd)
    font_size = 20
    font_family = Red Hat Display Medium
    position = 0, 85
    halign = center
    valign = center
}

# --- SALUDO / USUARIO ---
label {
    monitor =
    text = Hello, $USER
    color = rgb(dde1e7)
    font_size = 18
    font_family = Red Hat Display
    position = 0, 0
    halign = center
    valign = center
}

# --- CAMPO DE CONTRASEÑA ---
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgb(78a9ff)           # Azul IBM
    inner_color = rgb(262626)           # Superficie Oxocarbon
    font_color = rgb(dde1e7)            # Texto primario
    fade_on_empty = false
    rounding = 8                        # Bordes sutiles (a juego con las ventanas)

    placeholder_text = <span foreground="##a8b0bd">Enter password...</span>
    hide_input = false
    position = 0, -70
    halign = center
    valign = center

    # Estados UX
    check_color = rgb(33b1ff)           # Azul claro mientras valida con PAM
    capslock_color = rgb(ff7eb6)        # Rosa/magenta si Bloq Mayús está activo
    fail_color = rgb(ee5396)            # Error Oxocarbon
    fail_text = <i>Incorrect password ($ATTEMPTS)</i>
}
