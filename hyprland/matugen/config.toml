[config]
reload_apps = true

[config.custom_colors]
red = { color = "#ea6962", blend = true }
green = { color = "#a9b665", blend = true }
yellow = { color = "#d8a657", blend = true }
blue = { color = "#7daea3", blend = true }
magenta = { color = "#d3869b", blend = true }
cyan = { color = "#89b482", blend = true }

[templates.starship]
input_path = '~/.config/matugen/templates/starship.toml'
output_path = '~/.config/starship.toml'

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty'
output_path = '~/.config/ghostty/themes/matugen'
post_hook = 'pkill -SIGUSR2 ghostty || true'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'
post_hook = 'python3 ~/.config/matugen/scripts/generate_folders.py'

[templates.gtk4_dark]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk-dark.css'
