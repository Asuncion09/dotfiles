# Starship Prompt — Tema Material You dinámico generado por Matugen
# Paleta pastel armónica y suave integrada con el fondo de pantalla
add_newline = false
palette = "matugen"

format = """
$directory\
$git_branch\
$git_status\
$package\
$c\
$rust\
$golang\
$nodejs\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[palettes.matugen]
primary = "#dbc3a4"
on_primary = "#3d2e18"
primary_container = "#a38d71"
on_primary_container = "#000000"
secondary = "#d2c4b5"
on_secondary = "#372f25"
secondary_container = "#51483c"
tertiary = "#bdc7d9"
on_tertiary = "#27313f"
surface = "#151311"
surface_container = "#211f1d"
surface_container_high = "#2c2a27"
on_surface = "#e7e1dd"
on_surface_variant = "#d0c5b9"
outline = "#998f85"
error = "#ffb4ab"
# Tonos pastel armonizados (blend):
red = "#ffb59b"
green = "#d8cd71"
yellow = "#f6c16f"
blue = "#a3d0b9"
magenta = "#ffb3b3"
cyan = "#b6cf8e"

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:tertiary)"

[directory]
style = "bold fg:primary"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:red"

[git_branch]
style = "bold fg:tertiary"
symbol = " "

[git_status]
style = "fg:yellow"
conflicted = "[󰞇 ](fg:red)"
ahead = "[⇡${count} ](fg:cyan)"
behind = "[⇣${count} ](fg:red)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count} ](fg:yellow)"
untracked = "[󰋗 ](fg:cyan)"
stashed = "[󰛢 ](fg:blue)"
modified = "[󰛿 ](fg:yellow)"
staged = "[󰝒 ](bold fg:green)"
renamed = "[󰑕 ](fg:blue)"
deleted = "[󰅖 ](fg:red)"

[cmd_duration]
min_time = 2_000
style = "fg:outline"
format = "took [$duration]($style) "

[status]
disabled = false
symbol = "✘"
style = "bold fg:red"
format = "[$symbol $status]($style) "

[package]
style = "fg:secondary"
symbol = "󰏗 "

[nodejs]
style = "bold fg:green"
symbol = "󰎙 "

[python]
style = "bold fg:yellow"
symbol = "󰌠 "

[rust]
style = "bold fg:red"
symbol = "󱘗 "

[golang]
style = "bold fg:cyan"
symbol = "󰟓 "

[c]
style = "bold fg:blue"
symbol = "󰙲 "

[docker_context]
style = "bold fg:blue"
symbol = "󰡨 "
